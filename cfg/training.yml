# select RFC parameters
# see https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html
data: 'census-income-split:reference'
model: 'income-prediction-model'
random-seed: 0x870ee45f
random-forest-classifier:
  n_estimators: 275
  criterion: 'gini'
  max_depth: 100
  min_samples_split: 2
  min_samples_leaf: 1
  min_weight_fraction_leaf: 0.0
  max_features: 10
  max_leaf_nodes: null
  min_impurity_decrease: 0.0
  bootstrap: true
  oob_score: false
  n_jobs: -1
  verbose: 0
  ccp_alpha: 0.0
  max_samples: null

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    if: ${{ github.server_url == 'https://github.com' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Run-Time & Test Dependencies
        run: |
          pip install --group test .
      - name: Run Flake8
        run: |
          flake8
      - name: Run Unit Tests
        run: |
          pytest -v
